<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Enigma Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --stage: #150C2B;
    --panel: #221240;
    --panel-2: #2C1856;
    --gold: #F2B705;
    --gold-dim: #b98f0a;
    --pink: #FF4D6D;
    --green: #34D399;
    --ink: #F5F1FF;
    --ink-dim: #B7ADD9;
    --line: rgba(245,241,255,0.12);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, #2c1856 0%, var(--stage) 55%),
      var(--stage);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding:0;
  }
  #app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    padding:22px 18px 60px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .eyebrow{
    font-family:'Inter';font-weight:700;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold);
  }
  .brand{
    font-family:'Archivo Black',sans-serif;
    font-size:34px;line-height:1;
    letter-spacing:-0.01em;
    background:linear-gradient(90deg,var(--gold),#ffe08a);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin:2px 0 0;
  }
  .header{display:flex;flex-direction:column;gap:2px;margin-bottom:4px;}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }
  .card.raised{background:var(--panel-2);}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(245,241,255,0.08);
    border:1px solid var(--line);
    padding:5px 12px;border-radius:999px;
    font-size:12px;font-weight:600;color:var(--ink-dim);
  }
  .pill.gold{color:var(--gold);border-color:rgba(242,183,5,.4);background:rgba(242,183,5,.1);}

  .hub-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:14px;
    margin-top:20px;
  }
  @media (min-width:480px){
    .hub-grid{grid-template-columns:1fr 1fr;}
  }
  .game-card{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:22px 20px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--panel);
    text-decoration:none;
    color:var(--ink);
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .game-card:hover{
    transform:translateY(-2px);
    border-color:rgba(242,183,5,.4);
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .game-card:active{transform:translateY(0) scale(.99);}
  .game-icon{font-size:30px;line-height:1;}
  .game-title{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:19px;
  }
  .game-desc{
    font-size:13px;
    color:var(--ink-dim);
    line-height:1.4;
  }
  .game-card.disabled{
    cursor:not-allowed;
    opacity:.5;
    filter:grayscale(.4);
    pointer-events:none;
  }
  .game-card.disabled:hover{transform:none;box-shadow:none;border-color:var(--line);}
  .footer-note{
    text-align:center;
    color:var(--ink-dim);
    font-size:12px;
    margin-top:8px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="eyebrow">Enigma Games</div>
    <h1 class="brand">ENIGMA GAMES</h1>
    <div class="pill gold" style="margin-top:6px;width:fit-content;">Hub dei giochi</div>
  </div>

  <div class="card">
    Scegli un gioco per iniziare. Nuovi titoli in arrivo.
  </div>

  <div class="hub-grid">
    <a class="game-card" href="quizzettone.html">
      <div class="game-icon">🎉</div>
      <div class="game-title">Quizzettone</div>
      <div class="game-desc">Party quiz live per squadre, con classifica in tempo reale.</div>
      <div class="pill gold" style="width:fit-content;">Gioca ora</div>
    </a>

    <div class="game-card disabled">
      <div class="game-icon">🔟</div>
      <div class="game-title">Top Dieci</div>
      <div class="game-desc">In arrivo.</div>
      <div class="pill" style="width:fit-content;">Coming Soon</div>
    </div>

    <div class="game-card disabled">
      <div class="game-icon">🧩</div>
      <div class="game-title">???</div>
      <div class="game-desc">In arrivo.</div>
      <div class="pill" style="width:fit-content;">Coming Soon</div>
    </div>
  </div>

  <div class="footer-note">Enigma Games · altri titoli in arrivo</div>
</div>
</body>
</html>
